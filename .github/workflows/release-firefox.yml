name: Release Firefox

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: AMO channel
        required: true
        type: choice
        options:
          - listed
          - unlisted
        default: listed
      dry_run:
        description: Validate credentials and zips without uploading
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  submit:
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ github.event_name == 'push' && 'listed' || inputs.channel }}
      DRY_RUN: ${{ github.event_name == 'push' && 'false' || inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on main — refusing release"
            exit 1
          fi

      - name: Assert package version matches tag
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag version ($TAG) does not match package.json ($PKG)"
            exit 1
          fi
          echo "Releasing version $PKG"

      - name: Resolve release tag
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            PKG="$(node -p "require('./package.json').version")"
            echo "tag=v${PKG}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Zip Firefox extension
        run: npm run zip

      - name: Upload zip artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firefox-zips
          path: .output/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: .output/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Submit to Firefox AMO
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${FIREFOX_EXTENSION_ID:-}" ] || [ -z "${FIREFOX_JWT_ISSUER:-}" ] || [ -z "${FIREFOX_JWT_SECRET:-}" ]; then
            echo "Missing required secrets: FIREFOX_EXTENSION_ID, FIREFOX_JWT_ISSUER, FIREFOX_JWT_SECRET"
            exit 1
          fi
          SUBMIT_ARGS=(
            --firefox-zip .output/*-firefox.zip
            --firefox-sources-zip .output/*-sources.zip
            --firefox-channel "${CHANNEL}"
          )
          if [ "${DRY_RUN}" = "true" ]; then
            SUBMIT_ARGS+=(--dry-run)
          fi
          npx wxt submit "${SUBMIT_ARGS[@]}"
