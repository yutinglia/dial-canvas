<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <title>Dial Canvas free-form new tab interface map</title>
  <desc>A stylized dark canvas with movable speed dials, a clock, a note, a calendar, and a task list.</desc>
  <defs>
    <linearGradient id="dial-bg" x1="120" y1="30" x2="1460" y2="890" gradientUnits="userSpaceOnUse"><stop stop-color="#242A2C"/><stop offset="0.45" stop-color="#191D23"/><stop offset="1" stop-color="#111419"/></linearGradient>
    <linearGradient id="dial-surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#252B31"/><stop offset="1" stop-color="#171A20"/></linearGradient>
    <pattern id="dial-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#E8EAED" stroke-opacity="0.045"/></pattern>
    <filter id="dial-shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#050607" flood-opacity="0.42"/></filter>
    <style>.mono{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace}.sans{font-family:Inter,"Segoe UI",Arial,sans-serif}.fine{letter-spacing:.14em}.card{fill:url(#dial-surface);stroke:#E8EAED;stroke-opacity:.12}.muted{fill:#A5ABB1}.quiet{fill:#6E757C}.line{stroke:#E8EAED;stroke-opacity:.12}</style>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#dial-bg)"/><circle cx="1435" cy="86" r="240" fill="#6B8F71" fill-opacity=".09"/><circle cx="140" cy="790" r="250" fill="#D5B66E" fill-opacity=".055"/><rect x="28" y="28" width="1544" height="844" rx="24" stroke="#E8EAED" stroke-opacity=".09"/>
  <text x="78" y="78" class="mono fine" fill="#9AA1A8" font-size="15">DIAL CANVAS / NEW TAB</text><text x="1522" y="78" class="mono fine" fill="#6B8F71" font-size="13" text-anchor="end">LOCAL BY DEFAULT</text>
  <g filter="url(#dial-shadow)"><rect x="78" y="112" width="1444" height="606" rx="22" fill="#14181D" stroke="#E8EAED" stroke-opacity=".14"/><rect x="78" y="112" width="1444" height="606" rx="22" fill="url(#dial-grid)"/><path d="M800 160V688M126 415H1474" stroke="#6B8F71" stroke-opacity=".08" stroke-dasharray="5 8"/>
    <g><rect x="106" y="136" width="141" height="42" rx="21" fill="#20262C" stroke="#E8EAED" stroke-opacity=".12"/><circle cx="128" cy="157" r="5" fill="#6B8F71"/><text x="145" y="162" class="mono fine" fill="#C9CDD1" font-size="11">CANVAS 01</text><rect x="1292" y="136" width="92" height="42" rx="21" fill="#6B8F71"/><text x="1338" y="162" class="mono fine" fill="#101410" font-size="11" text-anchor="middle">EDIT</text><rect x="1394" y="136" width="100" height="42" rx="21" fill="#20262C" stroke="#E8EAED" stroke-opacity=".12"/><text x="1444" y="162" class="mono fine" fill="#AEB4B9" font-size="11" text-anchor="middle">SETTINGS</text></g>
    <g transform="translate(122 216)"><rect width="394" height="158" rx="18" class="card"/><text x="24" y="35" class="mono fine muted" font-size="11">HONG KONG / MONDAY</text><text x="24" y="104" class="sans" fill="#E8EAED" font-size="68" font-weight="550" letter-spacing="-3">09:41</text><text x="320" y="104" class="mono fine" fill="#6B8F71" font-size="12">24 AUG</text><line x1="24" y1="128" x2="370" y2="128" class="line"/><text x="24" y="148" class="mono fine quiet" font-size="9">START WHERE YOU LEFT OFF</text></g>
    <g transform="translate(558 218)"><rect width="398" height="198" rx="18" fill="#1B2026" stroke="#6B8F71" stroke-width="2"/><g fill="#6B8F71"><rect x="-7" y="-7" width="14" height="14" rx="3"/><rect x="391" y="-7" width="14" height="14" rx="3"/><rect x="-7" y="191" width="14" height="14" rx="3"/><rect x="391" y="191" width="14" height="14" rx="3"/></g><text x="22" y="34" class="mono fine" fill="#6B8F71" font-size="10">QUICK DIALS / SELECTED</text>
      <g transform="translate(22 58)"><rect width="72" height="72" rx="16" fill="#252C32" stroke="#E8EAED" stroke-opacity=".12"/><text x="36" y="47" class="sans" fill="#E8EAED" font-size="27" font-weight="650" text-anchor="middle">F</text><text x="36" y="94" class="mono quiet" font-size="9" text-anchor="middle">FIREFOX</text></g><g transform="translate(116 58)"><rect width="72" height="72" rx="16" fill="#252C32" stroke="#E8EAED" stroke-opacity=".12"/><text x="36" y="46" class="mono" fill="#E8EAED" font-size="20" font-weight="650" text-anchor="middle">MDN</text><text x="36" y="94" class="mono quiet" font-size="9" text-anchor="middle">DOCS</text></g><g transform="translate(210 58)"><rect width="72" height="72" rx="16" fill="#252C32" stroke="#E8EAED" stroke-opacity=".12"/><text x="36" y="46" class="mono" fill="#E8EAED" font-size="20" font-weight="650" text-anchor="middle">GH</text><text x="36" y="94" class="mono quiet" font-size="9" text-anchor="middle">GITHUB</text></g><g transform="translate(304 58)"><rect width="72" height="72" rx="16" fill="#252C32" stroke="#E8EAED" stroke-opacity=".12"/><text x="36" y="47" class="sans" fill="#E8EAED" font-size="27" font-weight="650" text-anchor="middle">W</text><text x="36" y="94" class="mono quiet" font-size="9" text-anchor="middle">WIKI</text></g>
    </g>
    <g transform="translate(1000 216)"><rect width="474" height="250" rx="18" class="card"/><text x="22" y="36" class="mono fine muted" font-size="11">TODAY / SMALL THINGS</text><line x1="22" y1="54" x2="452" y2="54" class="line"/><g transform="translate(22 79)"><rect width="18" height="18" rx="5" fill="#6B8F71"/><path d="M5 9.5L8 12.5L14 5.5" stroke="#101410" stroke-width="2"/><text x="34" y="14" class="sans quiet" font-size="14" text-decoration="line-through">Check the nightly build</text></g><g transform="translate(22 121)"><rect width="18" height="18" rx="5" stroke="#E8EAED" stroke-opacity=".25"/><text x="34" y="14" class="sans" fill="#D4D7DA" font-size="14">Tidy the new-tab layout</text></g><g transform="translate(22 163)"><rect width="18" height="18" rx="5" stroke="#E8EAED" stroke-opacity=".25"/><text x="34" y="14" class="sans" fill="#D4D7DA" font-size="14">Write down the useful part</text></g><text x="22" y="226" class="mono fine" fill="#6B8F71" font-size="10">+ ADD ITEM</text></g>
    <g transform="translate(122 416)"><rect width="296" height="250" rx="18" class="card"/><text x="22" y="35" class="mono fine muted" font-size="11">NOTE / SCRATCHPAD</text><line x1="22" y1="53" x2="274" y2="53" class="line"/><text x="22" y="90" class="sans" fill="#E8EAED" font-size="17" font-weight="570">Keep the useful bits.</text><text x="22" y="126" class="sans muted" font-size="13">The first version does not need</text><text x="22" y="148" class="sans muted" font-size="13">every option. It needs a clear</text><text x="22" y="170" class="sans muted" font-size="13">reason to come back tomorrow.</text><path d="M22 211H194" class="line"/><text x="22" y="232" class="mono quiet" font-size="9">SAVED LOCALLY</text></g>
    <g transform="translate(460 464)"><rect width="420" height="202" rx="18" class="card"/><text x="22" y="35" class="mono fine muted" font-size="11">AUGUST 2026</text><text x="398" y="35" class="mono" fill="#6B8F71" font-size="12" text-anchor="end">24</text><line x1="22" y1="53" x2="398" y2="53" class="line"/><g class="mono" font-size="9" text-anchor="middle"><text x="48" y="78" class="quiet">M</text><text x="102" y="78" class="quiet">T</text><text x="156" y="78" class="quiet">W</text><text x="210" y="78" class="quiet">T</text><text x="264" y="78" class="quiet">F</text><text x="318" y="78" class="quiet">S</text><text x="372" y="78" class="quiet">S</text><text x="48" y="112" class="muted">17</text><text x="102" y="112" class="muted">18</text><text x="156" y="112" class="muted">19</text><text x="210" y="112" class="muted">20</text><text x="264" y="112" class="muted">21</text><text x="318" y="112" class="muted">22</text><text x="372" y="112" class="muted">23</text><circle cx="48" cy="151" r="18" fill="#6B8F71"/><text x="48" y="155" fill="#101410">24</text><text x="102" y="155" class="muted">25</text><text x="156" y="155" class="muted">26</text><text x="210" y="155" class="muted">27</text><text x="264" y="155" class="muted">28</text><text x="318" y="155" class="muted">29</text><text x="372" y="155" class="muted">30</text></g></g>
    <g transform="translate(926 510)"><rect width="548" height="156" rx="18" fill="#20252B" stroke="#E8EAED" stroke-opacity=".12"/><text x="22" y="34" class="mono fine muted" font-size="11">WALLPAPER / SOFT CONCRETE</text><path d="M22 53H526" class="line"/><circle cx="54" cy="91" r="17" fill="#6B8F71" fill-opacity=".24" stroke="#6B8F71"/><path d="M49 91L53 95L60 87" stroke="#9EC8A4" stroke-width="2"/><text x="84" y="96" class="sans" fill="#DDE0E2" font-size="14">Use this image on Canvas 01</text><rect x="403" y="75" width="123" height="40" rx="20" fill="#2B3137"/><text x="464" y="99" class="mono fine muted" font-size="9" text-anchor="middle">CHANGE</text><text x="22" y="137" class="mono quiet" font-size="9">PHOTO INFO AVAILABLE · NO TRACKING</text></g>
  </g>
  <g transform="translate(78 768)"><text class="sans" fill="#E8EAED" font-size="38" font-weight="560" letter-spacing="-1.5">Your new tab, arranged your way.</text><text y="52" class="sans muted" font-size="16">Dials and widgets can move, resize, and settle wherever they make sense.</text></g><text x="1522" y="811" class="mono fine" fill="#6B8F71" font-size="12" text-anchor="end">DIALS · WIDGETS · WALLPAPERS · PAGES</text><text x="1522" y="841" class="mono fine quiet" font-size="10" text-anchor="end">FIREFOX-FIRST / OPTIONAL SYNC</text>
</svg>
